<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieVerse - Sign Up</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="login-container">

        <h1>🎬 MovieVerse</h1>

        <h2>Create Account</h2>

        <form action="/signup" method="POST">

            <input
                type="text"
                name="fullname"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <div class="password-box">

                <input
                    type="password"
                    id="signupPassword"
                    name="password"
                    placeholder="Password"
                    required
                >

                <span onclick="toggleSignupPassword()">👁️</span>

            </div>

            <div class="password-box">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required
                >

                <span onclick="toggleConfirmPassword()">👁️</span>

            </div>

            <button type="submit">

                Create Account

            </button>

        </form>

        <p>

            Already have an account?

            <a href="/">Login</a>

        </p>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
